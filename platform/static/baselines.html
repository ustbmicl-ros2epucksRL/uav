<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三维覆盖基线对照</title><link rel="stylesheet" href="static/style.css"><style>body{padding:24px}main{max-width:1400px;margin:auto}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin:20px 0}.controls label{display:grid;gap:6px}input,select,button{padding:8px}.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}#maps canvas{display:block;width:100%;height:auto;min-height:0;aspect-ratio:1;background:#eff4f8}article{background:white;padding:16px;border:1px solid #ccd7df}#status{white-space:pre-wrap}table{width:100%;margin:20px 0}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}#evidence{overflow-wrap:anywhere}</style><main>
<a href="./?tab=diagnosis&view=3d">← 返回三维感知诊断</a><h1>三维覆盖基线同条件对照</h1><p>一次实际运行，固定场景、已有设备、网格与目标条件，分别计算 B0 / B1 / B2。这里检验模型假设影响，尚无独立真值，不能判断哪一种更准确。</p>
<form id="form" class="controls"><label>场景<select id="scene"></select></label><label>计算范围<select id="profile"><option value="overview">全景 · 50m</option><option value="region">局部区域 · 10m</option><option value="fine">核心区域 · 2m</option></select></label><label>B2 探测概率阈值<input id="threshold" type="number" value="0.5" min="0.01" max="1" step="0.01" required></label><label>同频损耗 / dB<input id="cochannel" type="number" value="3" min="0" max="40" required></label><label>通信损耗 / dB<input id="communication" type="number" value="2" min="0" max="40" required></label><label>天气损耗 / dB<input id="weather" type="number" value="1" min="0" max="40" required></label><label>单设备预算 / 万元<input id="budget" type="number" value="50" min="0" max="1000" step="0.01" required></label><label>目标状态<select id="emitting"><option value="yes">有射频发射</option><option value="no">无线电静默</option></select></label><button id="run" class="primary">运行三组基线</button></form>
<p id="range"></p><div id="status" role="status">尚未运行，不显示预设结果。</div><div class="controls"><label>历史记录<select id="history"><option value="">选择已完成运行</option></select></label><button id="load">查看记录</button><button id="export" disabled>导出输入与完整结果</button></div>
<section id="results" hidden><p id="evidence"></p><div id="table"></div><label>高度切片 <select id="altitude"></select></label><p>覆盖图：绿＝覆盖，红＝未覆盖，灰＝无效空域。差异图：橙＝后一模型不再判为覆盖，蓝＝后一模型新增覆盖，浅灰＝无变化；均不代表实际漏检或准确率。</p><div id="maps" class="maps"></div><section id="impact"></section></section>
</main><script src="static/baselines.js"></script></html>
